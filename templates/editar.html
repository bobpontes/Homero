<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    <title>Homero — Editar Aluno</title>
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <h2 class="logo">Homero</h2>

            <nav>
                <a href="/">📚 Alunos</a>
                <a href="/financeiro">💰 Financeiro</a>
                <a href="/contas_pagar">💸 Contas a Pagar</a>
                <a href="/contas_receber">💵 Contas a Receber</a>
                <a href="/contas_bancarias">🏦 Contas Bancárias</a>
            </nav>
        </aside>
        <main class="content">
            <div class="container">
                <section class="form-section card">
                    <h1>✏️ Editar Alunos</h1>
                    <form method="POST", class="form input">
                        Nome:
                        <input type="text" name="nome" value="{{ aluno[1] }}" required><br>

                        Idade:
                        <input type="number" name="idade" value="{{ aluno[2] }}" required><br>

                        Turma:
                        <input type="text" name="turma" value="{{ aluno[3] }}" required><br>

                        <button type="submit">Salvar Alterações</button>
                    </form>
                </section>
            </div>
            <div class="container">
                <a href="/">
                    <button class="btn-back">Voltar</button>
                </a>
            </div>
        </main>
    </div>
</body>
</html>
